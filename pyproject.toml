[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parserix"
version = "0.4.0"
description = "Parse metadata from ImageXpress files and paths"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Mungo Harvey, Scott Warchal", email = "mharvey2@ed.ac.uk"}
]
keywords = ["imagexpress", "metadata", "parsing", "microscopy", "bioinformatics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.1",
    "mypy>=1.0",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.1",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/CarragherLab/parserix"
Repository = "https://github.com/CarragherLab/parserix"
"Bug Tracker" = "https://github.com/CarragherLab/parserix/issues"
Documentation = "https://github.com/CarragherLab/parserix#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/parserix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 88
exclude = [".venv", "build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # Allow assert statements in tests

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true
